
name: Build Fatih Client

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          PROJECT=$(find . -name build.gradle -o -name build.gradle.kts | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "Gradle project not found!"
            exit 1
          fi
          cd "$(dirname "$PROJECT")"
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Fatih-Client-JAR
          path: '**/build/libs/*.jar'
          if-no-files-found: error
